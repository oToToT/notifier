[package]
name = "notifier-destination-discord"
version = "0.1.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
notifier-runtime = { path = "../../../crates/notifier-runtime" }
schemars = { version = "1", features = ["derive", "url2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { git = "https://github.com/serenity-rs/serenity.git", branch = "next", default-features = false, features = ["builder", "http", "model", "rustls_backend"] }
tracing = "0.1"
